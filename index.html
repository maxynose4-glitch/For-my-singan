<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love 💗</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:linear-gradient(-45deg,#ff758c,#ff7eb3,#ff9a9e,#fad0c4);
background-size:400% 400%;
animation:bg 10s ease infinite;
overflow:hidden;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.page{
display:none;
width:90%;
max-width:500px;
padding:30px;
text-align:center;
background:rgba(255,255,255,0.2);
backdrop-filter:blur(12px);
border-radius:25px;
color:white;
box-shadow:0 0 20px rgba(255,255,255,0.3);
}

.page.active{
display:block;
}

h1,h2,h3{
margin-bottom:15px;
}

p{
font-size:18px;
line-height:1.5;
}

button{
padding:12px 20px;
margin:8px;
border:none;
border-radius:15px;
font-size:16px;
cursor:pointer;
background:white;
color:#ff4d88;
font-weight:bold;
}

button:hover{
transform:scale(1.05);
}

textarea{
width:100%;
height:100px;
border:none;
border-radius:15px;
padding:10px;
margin-top:10px;
resize:none;
}

.heart{
font-size:70px;
animation:beat 1s infinite;
}

@keyframes beat{
50%{
transform:scale(1.2);
}
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page active" id="page1">
<h1>Finally u came 🥹💗</h1>
<p>I've been missing u the whole day...</p>
<br>
<button onclick="nextPage(2)">Continue ❤️</button>
</div>

<!-- PAGE 2 -->
<div class="page" id="page2">
<h1>You know what I did today? 🥺</h1>
<p>I missed ur sigan the whole day 💗</p>
<br>
<button onclick="nextPage(3)">Aww 😚</button>
</div>

<!-- PAGE 3 -->
<div class="page" id="page3">
<h1>How was ur day? 💕</h1>

<button onclick="showWhy()">Good 😊</button>
<button onclick="showWhy()">Very Good 😍</button>
<button onclick="showWhy()">Baddd 😭</button>
<button onclick="showWhy()">Average 😶</button>

<div id="whyBox" style="display:none;">
<br>
<h3>Why?? 🥺</h3>

<textarea placeholder="Tell me about your day..."></textarea>

<br><br>

<button onclick="nextPage(4)">Next 💗</button>
</div>
</div>

<!-- PAGE 4 -->
<div class="page" id="page4">

<div class="heart">💗</div>

<h1>I missed u 💗</h1>
<h2>I lobbb uuuuu ❤️</h2>

<br>

<h3>Did u leemong bhatey miss and lob me?? 🥺💞</h3>

<button onclick="showAnswer()">Yes 💗</button>
<button onclick="showAnswer()">Yes ofc 😚</button>
<button onclick="showAnswer()">Yessss so much 🥹❤️</button>

<div id="answerBox" style="display:none;">
<br>
<h2>Awwww 💗</h2>
<p>I love youuuuu so much 💞</p>
</div>

</div>

<script>

function nextPage(page){
document.querySelectorAll(".page").forEach(p=>{
p.classList.remove("active");
});
document.getElementById("page"+page).classList.add("active");
}

function showWhy(){
document.getElementById("whyBox").style.display="block";
}

function showAnswer(){
document.getElementById("answerBox").style.display="block";
}

</script>

</body>
</html>
